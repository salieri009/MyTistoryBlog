<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살리에리의 인생살이 채널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

:root { --stage-bg:#e9e9e6; --slide-bg:#ffffff; --ink:#0b0b0b; --red:#ff3300; --rule:#0b0b0b; }
.slide { font-family: "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); }
.grid { position:absolute; inset:0; background-image: linear-gradient(to right, rgba(0,0,0,.06) 1px, transparent 1px); background-size: 160px 100%; }
.mast { position:absolute; left:160px; top:96px; right:160px; display:flex; justify-content:space-between; font: 600 22px/1 Archivo, sans-serif; letter-spacing:.08em; text-transform:uppercase; border-top:6px solid var(--ink); padding-top:20px; }
.num { position:absolute; left:140px; top:190px; font: 900 520px/0.8 Archivo, sans-serif; letter-spacing:-.04em; color: var(--ink); }
.num small { font-size: 96px; letter-spacing:0; vertical-align: top; margin-left: 12px; color: var(--red); }
.block { position:absolute; left:160px; bottom:120px; width:960px; }
.block h1 { font-weight:800; font-size:92px; line-height:1.12; letter-spacing:-.02em; margin:0 0 28px; word-break:keep-all; }
.block p { font-size:30px; line-height:1.6; margin:0; max-width: 820px; color:#333; word-break:keep-all; }
.side { position:absolute; right:160px; top:420px; width:480px; border-top:6px solid var(--red); padding-top:24px; }
.side li { list-style:none; border-bottom:2px solid var(--ink); padding:22px 0; font-size:27px; font-weight:600; line-height:1.4; word-break:keep-all; }
.side li span { display:block; font: 600 18px/1 Archivo, sans-serif; letter-spacing:.1em; color:var(--red); margin-bottom:10px; }
.side ul { margin:0; padding:0; }
.sq { position:absolute; right:160px; top:190px; width:160px; height:160px; background: var(--red); }
.reveal { opacity:0; transform: translateY(24px); animation: up .7s cubic-bezier(.2,.7,.1,1) forwards; }
.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}
@keyframes up { to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage">
<section class="slide active">
  <div class="grid"></div>
  <div class="mast reveal d1"><span>Salieri — Life Channel</span><span>나의 성장기 · 486 Posts</span></div>
  <div class="num reveal d2">486<small>posts</small></div>
  <div class="sq reveal d3"></div>
  <div class="block reveal d3">
    <h1>살리에리의<br>인생살이 채널</h1>
    <p>제가 걸어온 길이 당신에게 도움이 되는 이정표였으면 좋겠네요.</p>
  </div>
  <div class="side reveal d4"><ul>
    <li><span>Nº 512 · CLOUD + DEVOPS</span>[LG CNS] 최종 프로젝트 3일차 :: 아이디어를 꼬아 간 생각의 순서</li>
    <li><span>Nº 511 · 컴퓨터 공학</span>대시보드를 버리고 생각해보면야</li>
    <li><span>Nº 509 · 유학이야기</span>[일기] 당연함을 잃어버린다는 것</li>
  </ul></div>
</section>
</div></div>
<script>
(function(){var s=document.querySelector('.deck-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='translate('+(innerWidth-1920*k)/2+'px,'+(innerHeight-1080*k)/2+'px) scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
