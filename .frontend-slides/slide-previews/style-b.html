<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살리에리의 인생살이 채널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Barlow+Condensed:wght@600;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

:root { --stage-bg:#1a1a17; --slide-bg:#E2DCC9; --ink:#0A0A0A; --paper:#F4EFE0;
  --sienna:#A06A3C; --magenta:#C73B7A; --orange:#EE7A2E; --teal:#2D7E73; --blue:#2F55A4; --mustard:#D9A72B; --olive:#6E7A36; }
.slide { font-family:"Pretendard Variable",Pretendard,sans-serif; color:var(--ink); }
.chrome { position:absolute; left:96px; right:96px; top:70px; display:flex; justify-content:space-between; font:800 24px/1 "Barlow Condensed",sans-serif; letter-spacing:.12em; text-transform:uppercase; }
.title { position:absolute; left:96px; top:150px; }
.title .en { font:700 210px/0.86 "Stardos Stencil",serif; letter-spacing:-.01em; text-transform:uppercase; }
.title .ko { font:400 120px/1.05 "Black Han Sans",sans-serif; margin-top:18px; letter-spacing:0; }
.lede { position:absolute; left:96px; bottom:96px; width:720px; font-size:28px; line-height:1.6; word-break:keep-all; }
.tablets { position:absolute; right:96px; top:150px; width:860px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.t { border-radius:24px; padding:26px 26px 22px; min-height:236px; display:flex; flex-direction:column; justify-content:space-between; color:var(--paper); }
.t b { font:700 120px/0.9 "Stardos Stencil",serif; }
.t span { font:800 24px/1.2 "Barlow Condensed","Pretendard Variable",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
.t.wide { grid-column: span 2; }
.c1{background:var(--orange)} .c2{background:var(--teal)} .c3{background:var(--magenta)} .c4{background:var(--olive)} .c5{background:var(--blue)} .c6{background:var(--ink)}
.reveal { opacity:0; transform:scale(.96); animation:pop .6s cubic-bezier(.3,1.4,.5,1) forwards; }
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes pop { to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage">
<section class="slide active">
  <div class="chrome reveal d1"><span>Salieri · Life Channel</span><span>Vol. 512</span></div>
  <div class="title reveal d2"><div class="en">Salieri</div><div class="ko">인생살이 채널</div></div>
  <p class="lede reveal d3">좋아하는 것과 싫어하는 것, 그리고 왜 안 되나 싶은 것들. 제가 걸어온 길이 당신에게 이정표였으면 좋겠네요.</p>
  <div class="tablets">
    <div class="t c1 reveal d2"><b>145</b><span>컴퓨터 공학</span></div>
    <div class="t c2 reveal d3"><b>109</b><span>일상이야기</span></div>
    <div class="t c3 reveal d4"><b>99</b><span>취미이야기</span></div>
    <div class="t c4 reveal d5"><b>35</b><span>호주 살이</span></div>
    <div class="t c5 wide reveal d6"><b>15</b><span>일본어 공부 · 어학 공부 이야기</span></div>
  </div>
</section>
</div></div>
<script>
(function(){var s=document.querySelector('.deck-stage');function f(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform='translate('+(innerWidth-1920*k)/2+'px,'+(innerHeight-1080*k)/2+'px) scale('+k+')';}addEventListener('resize',f);f();})();
</script>
</body>
</html>
